name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            npm install
          fi

      - name: Build website
        if: hashFiles('package.json') != ''
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');if(!p.scripts||!p.scripts.build)process.exit(0);if(p.dependencies?.['react-scripts']||p.devDependencies?.['react-scripts']){p.homepage='https://neeya375.github.io/project';fs.writeFileSync('package.json',JSON.stringify(p,null,2));}"
          node -e "const p=require('./package.json');process.exit((p.dependencies?.vite||p.devDependencies?.vite)?0:1)" && npm run build -- --base=/project/ || {
            code=$?
            if [ "$code" -ne 1 ]; then exit "$code"; fi
            npm run build
          }

      - name: Select deployment directory
        id: artifact
        run: |
          if [ -d dist ]; then
            echo "path=dist" >> "$GITHUB_OUTPUT"
          elif [ -d build ]; then
            echo "path=build" >> "$GITHUB_OUTPUT"
          elif [ -d out ]; then
            echo "path=out" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.artifact.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
